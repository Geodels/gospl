name: minimal soil-aware SPL + stratigraphy (regolith-mode) test

# Soil + stratigraphy fixture. Stratigraphy is enabled purely by the
# `time: strat:` interval (stratNb = (end-start)/strat + 1 > 0) — no `strata:`
# block needed. Used to exercise `soil: mode: regolith` with recorded stratal
# layers (DESIGN_SOIL_REGOLITH.md step 2). Reuses the shared mesh + soiltemp.

domain:
    npdata: ['mesh','v','c','z']
    flowdir: 2
    bc: '1111'
    seadepo: True
    nodep: False

time:
    start: 0.
    end: 40
    tout: 20
    dt: 10.
    strat: 10.

spl:
    K: 4.0e-6
    d: 0.
    m: 0.5
    G: 1.0

diffusion:
    hillslopeKa: 0.01
    hillslopeKm: 0.2

soil:
    soilK: 8.0e-6
    maxProd: 50.e-6
    depthProd: 0.5
    uniform: 1.0
    tempMap: ['soiltemp', 't']
    activation: 40.e3
    tempRef: 15.0

sea:
    position: -100.

climate:
  - start: 0.
    uniform: 1

output:
    dir: 'soil_strata_out'
