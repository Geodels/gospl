# Installing goSPL natively on NCI Gadi (venv on top of the system modules).
# Full guide: docs/getting_started/installHPC.rst.
# XXX/USERXXX = your home directory, PRJ = your project code.

# Login
# ssh USERXXX@gadi.nci.org.au

# To copy local data to project or home or scratch
# scp -r data.zip USERXXX@gadi-dm.nci.org.au:/g/data/PRJ/USERXXX
# scp -r data.zip USERXXX@gadi-dm.nci.org.au:/home/XXX/USERXXX
# scp -r data.zip USERXXX@gadi-dm.nci.org.au:/scratch/PRJ/USERXXX

################################################################
#       Installing the virtual environment on Gadi NCI.        #
################################################################

# Ignore ~/.local site-packages. A --system-site-packages venv also sees the
# user site, and an old goSPL there (e.g. an editable install whose build/
# directory was deleted) shadows the venv copy with
# "FileNotFoundError: ... build/cp311". Add this line to ~/.bashrc too.
export PYTHONNOUSERSITE=1

# System modules
module load intel-mpi/2021.13.0 hdf5/1.12.1p petsc/3.21.3 netcdf/4.9.2p intel-mkl/2023.2.0 python3/3.11.7
export PYTHONPATH=$PETSC_BASE/lib/mpich/Intel:$PYTHONPATH  # system mpi4py/petsc4py

# Virtual environment (system-site-packages inherits numpy, scipy, ...)
python3 -m venv --system-site-packages /home/XXX/USERXXX/envi_gospl
source /home/XXX/USERXXX/envi_gospl/bin/activate

# Build backend FIRST: --no-build-isolation below makes pip skip
# pyproject.toml's [build-system] requirements.
python3 -m pip cache purge
python3 -m pip install numpy
python3 -m pip install ninja
python3 -m pip install meson
python3 -m pip install meson_python   # 0.16+

# Runtime dependencies
python3 -m pip install mpi4py         # 4.0+
python3 -m pip install netCDF4        # 1.7+
python3 -m pip install h5py           # 3.11+
python3 -m pip install vtk            # 9.3+
python3 -m pip install xarray
python3 -m pip install ruamel.yaml
python3 -m pip install numpy-indexed
python3 -m pip install pyshtools

# Install goSPL (cd to your goSPL clone). A regular install, not -e: an
# editable install breaks as soon as the clone's build/ directory is removed.
python3 -m pip install --no-deps --no-build-isolation .

################################################################
#                 Checking the installation.                   #
################################################################

# 1. goSPL must be imported from the venv, i.e. the path printed is under
#    /home/XXX/USERXXX/envi_gospl/lib/python3.11/site-packages/gospl/
python3 -c "import gospl; print(gospl.__version__, gospl.__file__)"

# 2. Run the minimal regression fixture on 4 ranks (edit #PBS -P / storage in
#    the script first). The job log ends with "goSPL install OK (4 ranks)".
qsub -v GOSPL_SRC=/home/XXX/USERXXX/codes/gospl,GOSPL_VENV=/home/XXX/USERXXX/envi_gospl/bin/activate \
     hpc_setup/nciRun.pbs

################################################################
#                 PBS script for a goSPL run.                  #
################################################################

#!/bin/bash
#PBS -l ncpus=48
#PBS -l mem=190GB
#PBS -q normal
#PBS -P PRJ
#PBS -l walltime=10:00:00
#PBS -l storage=gdata/PRJ+scratch/PRJ
#PBS -l wd

# One thread per MPI rank; ignore ~/.local site-packages
export OMP_NUM_THREADS=1
export OPENBLAS_NUM_THREADS=1
export MKL_NUM_THREADS=1
export PYTHONNOUSERSITE=1

# Load required modules
module load intel-mpi/2021.13.0 hdf5/1.12.1p petsc/3.21.3 netcdf/4.9.2p intel-mkl/2023.2.0 python3/3.11.7
export PYTHONPATH=$PETSC_BASE/lib/mpich/Intel:$PYTHONPATH

# Activate the virtual environment
source /home/XXX/USERXXX/envi_gospl/bin/activate

# Simulation run
mpirun -np $PBS_NCPUS python3 -m gospl -i input-file-name.yml

deactivate
